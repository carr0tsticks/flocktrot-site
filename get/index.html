<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get FlockTrot</title>
<!--
  /get — the destination for paid links (Reddit Ads and anything else that
  can only take one URL). Detects the phone and sends it straight to the
  right store with attribution attached, so installs show up as a campaign
  in App Store Connect and as a tracked channel in Play Console. Desktop
  goes to the homepage with the same UTM tags.

  Usage:  https://www.flocktrot.com/get?src=reddit&c=camping-sep26
    src  the channel  (default "reddit")     -> utm_source / Apple campaign prefix
    c    the campaign (default "camping-sep26")
    m    the medium   (default "cpc")        -> utm_medium; e.g. m=tv for the
         QR code on the WPT TV spot (2026-10-07), so it isn't counted as paid clicks

  Apple attribution uses the provider token ("pt=") generated once in App
  Store Connect > App Analytics > Acquisition > Campaigns (2026-09-23). The
  campaign name sent as "ct=" is "<src>-<c>", so results land under
  Acquisition > Campaigns keyed by that name.

  Each visit is also counted (2026-09-28) through the public log_link_hit()
  function in the prod Supabase project, so the dashboard can show how many
  ad clicks actually arrive, and from which kind of device. It records only
  the source, campaign and device class (iPhone / Android / desktop): no IP
  address, no user agent, no cookie. The key below is the publishable anon
  key the app itself ships with; it can call that function and nothing
  else on the table. The redirect never waits more than 700 ms for it.
  Add &nolog=1 to test the link without counting the visit.
-->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF3E7">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#FAF3E7; color:#3B3220;
         min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; }
  h1 { font-size:1.3rem; margin:0 0 8px; }
  p { color:#7A7057; margin:0 0 20px; }
  a.btn { display:inline-block; margin:6px; padding:12px 20px; border-radius:999px; background:#6B7A45; color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Opening the store…</h1>
  <p>If nothing happens, pick your phone:</p>
  <a class="btn" id="ios" href="https://apps.apple.com/us/app/flocktrot/id6800438059">App Store</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.flocktrot.camptripplanner">Google Play</a>
</main>
<script>
(function () {
  var APPLE_PT = "129297103";              // App Store Connect campaign provider token (FlockTrot)
  var q = new URLSearchParams(location.search);
  var src = (q.get("src") || "reddit").replace(/[^a-z0-9_-]/gi, "").toLowerCase() || "reddit";
  var camp = (q.get("c") || "camping-sep26").replace(/[^a-z0-9_-]/gi, "").toLowerCase() || "camping-sep26";
  var medium = (q.get("m") || "cpc").replace(/[^a-z0-9_-]/gi, "").toLowerCase() || "cpc";

  // Play Console reads UTM tags out of the encoded `referrer` parameter.
  var utm = "utm_source=" + src + "&utm_medium=" + medium + "&utm_campaign=" + camp;
  var play = "https://play.google.com/store/apps/details?id=com.flocktrot.camptripplanner&referrer=" + encodeURIComponent(utm);
  // 2026-10-02: Android must open the Play Store APP, not the website. A
  // script redirect to play.google.com loads the Play web page in whatever
  // browser the click came from -- inside Reddit's in-app browser that page
  // isn't signed in to Google, so "Install" asks for a sign-in and people
  // give up (about 40 Android ad visits, zero installs). The intent:// form
  // hands off to the Play Store app (com.android.vending) with the same
  // referrer, and Chrome falls back to the web page itself if it can't.
  var playApp = "intent://details?id=com.flocktrot.camptripplanner&referrer=" + encodeURIComponent(utm) +
    "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";

  // App Store Connect reads `pt` (provider) + `ct` (campaign); mt=8 = apps.
  var ios = "https://apps.apple.com/us/app/flocktrot/id6800438059";
  if (APPLE_PT) ios += "?pt=" + encodeURIComponent(APPLE_PT) + "&ct=" + encodeURIComponent(src + "-" + camp) + "&mt=8";

  document.getElementById("ios").href = ios;
  document.getElementById("android").href = play;

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  // An app's built-in WebView ("; wv)" in the UA) may not hand intent://
  // links to other apps, and a failed hand-off replaces this page with an
  // error. There, stay put and let a tap on the button do it instead.
  var isWebView = isAndroid && /; wv\)/.test(ua);
  var dest = isIOS ? ios : isAndroid ? playApp : "/?" + utm;
  // The visible button gets the app hand-off too: a tap counts as a user
  // gesture, which some in-app browsers require before leaving for an app.
  if (isAndroid) document.getElementById("android").href = playApp;
  if (isWebView) {
    document.querySelector("h1").textContent = "Get FlockTrot on Google Play";
    document.querySelector("p").textContent = "Tap below to open the Play Store.";
    document.getElementById("ios").style.display = "none";
    var web = document.createElement("p");
    web.innerHTML = 'Nothing happening? <a href="' + play + '">Open the Google Play website</a>.';
    document.querySelector("main").appendChild(web);
  }

  var gone = false;
  function go() {
    if (gone) return;
    gone = true;
    location.replace(dest);
    // If an in-app browser ignored the hand-off and we're still on screen,
    // fall back to the Play web page (the old behaviour) after a moment.
    if (isAndroid) setTimeout(function () { if (!document.hidden) location.replace(play); }, 2500);
  }
  if (q.get("nolog")) { if (!isWebView) setTimeout(go, 60); return; }
  if (!isWebView) setTimeout(go, 700);
  try {
    var SUPABASE_URL = "https://nnfcyjjhhzhbrtnxjllw.supabase.co";
    var SUPABASE_KEY = "sb_publishable_jLkLItc2ai4-TwOQufjI7w_eqlVatVc";
    fetch(SUPABASE_URL + "/rest/v1/rpc/log_link_hit", {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_src: src, p_campaign: camp, p_device: isIOS ? "ios" : isAndroid ? "android" : "desktop" })
    }).then(isWebView ? null : go, isWebView ? null : go);
  } catch (e) { go(); }
})();
</script>
</body>
</html>
