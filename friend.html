<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add me on FlockTrot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4a6b47}
a:hover{color:#33472f}
</style>
</head>
<body>
<div style="min-height:100vh;background:#FAF3E7;font-family:'Work Sans',sans-serif;color:#2c3a2c;display:flex;flex-direction:column;">

  <header style="width:100%;box-sizing:border-box;">
    <div style="display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;padding:22px 28px;">
      <a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#33472f;font-weight:700;font-size:18px;font-family:'Zilla Slab',serif;">FlockTrot</a>
      <nav style="display:flex;gap:24px;">
        <a href="privacy-policy.html" style="color:#6b6558;text-decoration:none;font-size:14px;font-weight:500;">Privacy</a>
        <a href="terms-of-service.html" style="color:#6b6558;text-decoration:none;font-size:14px;font-weight:500;">Terms</a>
      </nav>
    </div>
  </header>

  <div style="width:100%;box-sizing:border-box;">
    <div style="max-width:960px;margin:0 auto;padding:0 28px;">
      <svg width="100%" height="110" viewBox="0 0 800 110" preserveAspectRatio="xMinYMid meet" aria-hidden="true" style="display:block">
        <polygon points="0,110 150,28 300,110" fill="#c9d6c2"></polygon>
        <polygon points="110,110 300,14 490,110" fill="#9fb495"></polygon>
        <polygon points="320,110 500,36 680,110" fill="#4a6b47"></polygon>
        <polygon points="530,110 660,52 800,110" fill="#33472f"></polygon>
        <circle cx="690" cy="26" r="20" fill="#c98a3e"></circle>
      </svg>
    </div>
  </div>

  <main style="flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px 64px;margin-top:-20px;">
    <div style="background:#FAF3E7;border-radius:16px;padding:24px 28px 4px;">
      <img class="logo" src="logo.png" alt="FlockTrot" style="width:120px;height:auto;margin-bottom:12px;">
    </div>

    <div id="app"></div>
  </main>

  <footer style="width:100%;box-sizing:border-box;border-top:1px solid #e8e0cf;padding:24px 24px;">
    <div style="max-width:960px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;">
      <nav style="display:flex;gap:16px;">
        <a href="privacy-policy.html" style="color:#4a6b47;text-decoration:none;font-size:13px;">Privacy Policy</a>
        <span style="color:#c9bfa3;font-size:13px;">·</span>
        <a href="terms-of-service.html" style="color:#4a6b47;text-decoration:none;font-size:13px;">Terms of Service</a>
      </nav>
      <div style="color:#6b6558;font-size:12px;">© 2026 FlockTrot</div>
    </div>
  </footer>

</div>

<script>
  function getCamperId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }

  const camperId = getCamperId();
  const app = document.getElementById("app");

  if (!camperId) {
    app.innerHTML = `
      <h1 style="color:#33472f;font-size:26px;margin:0 0 8px;font-family:'Zilla Slab',serif;">Link incomplete</h1>
      <p style="color:#6b6558;font-size:15px;max-width:360px;margin:0;">This link is missing a Camper ID. Ask whoever shared it to resend it from FlockTrot.</p>
    `;
  } else {
    const appLink = "camptripplanner://friend/" + encodeURIComponent(camperId);
    const appStoreLink = "https://apps.apple.com/us/app/flocktrot/id6800438059";

    // Same App-Store-first structure as invite.html (2026-08-28 fix) — most
    // taps on this link are from someone who doesn't have the app yet, so
    // that path needs to be first-class, not a footnote under a button that
    // may silently do nothing.
    const isAndroid = /android/i.test(navigator.userAgent);
    const storeSection = isAndroid
      ? `<p style="font-size:13px;color:#6b6558;line-height:1.5;margin:0;">FlockTrot for Android is finishing up testing right now. Email <a href="mailto:flocktrot@gmail.com">flocktrot@gmail.com</a> for early access, or open this link on an iPhone — it's live on the App Store there.</p>`
      : `<a href="${appStoreLink}" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#000;color:#fff;font-size:15px;font-weight:700;padding:13px 22px;border-radius:10px;text-decoration:none;width:100%;box-sizing:border-box;">Download on the App Store</a>`;

    app.innerHTML = `
      <h1 style="color:#33472f;font-size:26px;margin:0 0 8px;font-family:'Zilla Slab',serif;">Add me on FlockTrot!</h1>
      <p style="color:#6b6558;font-size:15px;margin:0 0 20px;max-width:360px;">Already have FlockTrot? Tap below to send a friend request directly.</p>
      <a class="open-btn" href="${appLink}" style="display:inline-block;background:#4a6b47;color:#fff;font-size:17px;font-weight:700;padding:16px 34px;border-radius:10px;text-decoration:none;margin-bottom:32px;">Open in FlockTrot</a>

      <div style="background:#ffffff;border:1px solid #e8e0cf;border-radius:12px;padding:22px;max-width:380px;width:100%;box-shadow:0 2px 10px rgba(51,71,47,0.06);box-sizing:border-box;">
        <h2 style="color:#33472f;font-size:16px;margin:0 0 10px;font-family:'Zilla Slab',serif;">Don't have FlockTrot yet?</h2>
        ${storeSection}
        <p style="font-size:12px;color:#9a917c;line-height:1.5;margin:16px 0 0;">After installing, come back to this link, or open FlockTrot, go to Menu &gt; Friends &gt; Add a friend, and enter this Camper ID:</p>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
          <div style="flex:1;background:#FAF3E7;border:1px dashed #c9bfa3;border-radius:6px;padding:9px 11px;font-family:monospace;font-size:12px;color:#2c3a2c;overflow-x:auto;white-space:nowrap;" id="codeBox">${camperId}</div>
          <button id="copyBtn" style="background:#c98a3e;color:#fff;border:none;border-radius:6px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;">Copy</button>
        </div>
      </div>
    `;

    // No scripted auto-navigation to appLink — see invite.html's identical
    // note: iOS Safari can treat that as untrusted and suppress the real
    // tap on the button right after it too.

    document.getElementById("copyBtn").addEventListener("click", function () {
      const btn = this;
      navigator.clipboard.writeText(camperId).then(() => {
        btn.textContent = "Copied!";
        btn.style.background = "#4a6b47";
        setTimeout(() => {
          btn.textContent = "Copy";
          btn.style.background = "#c98a3e";
        }, 2000);
      });
    });
  }
</script>
</body>
</html>
