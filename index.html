<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlockTrot — Group camping trip planner</title>
<style>
  :root {
    --bg: #FAF3E7;
    --ink: #2c3a2c;
    --olive: #4a6b47;
    --olive-dark: #33472f;
    --orange: #c98a3e;
    --muted: #6b6558;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    margin: 0 0 8px;
  }
  .logo {
    width: 220px;
    height: auto;
    margin-bottom: 8px;
  }
  .tagline {
    color: var(--muted);
    font-size: 17px;
    margin-bottom: 32px;
  }
  .badges {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 40px;
  }
  .badge {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 8px;
    background: #e8e0cf;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .badge.live {
    background: var(--olive);
    color: white;
  }
  footer {
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  footer a {
    color: var(--olive);
    margin: 0 10px;
  }
</style>
</head>
<body>
  <h1><img class="logo" src="logo.png" alt="FlockTrot"></h1>
  <p class="tagline">Plan group camping trips together — itineraries, supplies, campsites, expenses and more. All geared for groups to plan together</p>

  <div class="badges">
    <span class="badge">Coming soon to Google Play</span>
    <span class="badge">Coming soon on iOS</span>
  </div>

  <footer>
    <a href="privacy-policy.html">Privacy Policy</a> · <a href="terms-of-service.html">Terms of Service</a>
  </footer>
</body>
</html>
