<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited to a trip — FlockTrot</title>
<meta name="description" content="Open your FlockTrot trip invite.">
<!-- Per-invite landing page: nothing stable to index. Kept crawlable (see
     robots.txt) so this noindex is actually seen. -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FAF3E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14180F" media="(prefers-color-scheme: dark)">
<meta name="apple-itunes-app" content="app-id=6800438059">
<meta property="og:title" content="You're invited to a FlockTrot trip">
<meta property="og:description" content="Open the invite to join the trip — free on iPhone and Android.">
<meta property="og:image" content="https://www.flocktrot.com/img/og-image.png">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html">
      <img src="img/logo.webp" srcset="img/logo.webp 1x, img/logo@2x.webp 2x" width="260" height="63" alt="FlockTrot" style="height:30px;width:auto">
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms-of-service.html">Terms</a>
    </nav>
  </div>
</header>

<main class="stage">
  <img src="img/logo-stacked.webp" srcset="img/logo-stacked.webp 1x, img/logo-stacked@2x.webp 2x"
       width="300" height="236" alt="" style="width:132px;height:auto;margin-bottom:var(--space-5)" decoding="async">
  <div id="app" style="width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center"></div>
</main>

<footer class="site-footer">
  <div class="wrap center">
    <nav style="display:flex;gap:var(--space-4);justify-content:center;margin-bottom:var(--space-3)">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
    </nav>
    <p style="font-size:.82rem;color:var(--ink-muted)">© 2026 FlockTrot</p>
  </div>
</footer>

<script>
  var APP_STORE = "https://apps.apple.com/us/app/flocktrot/id6800438059";
  var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.flocktrot.camptripplanner";

  var APPLE_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.05 12.94c-.03-2.7 2.2-4 2.3-4.06-1.25-1.83-3.2-2.08-3.9-2.11-1.66-.17-3.24.98-4.08.98-.84 0-2.14-.96-3.52-.93-1.81.03-3.48 1.05-4.41 2.67-1.88 3.26-.48 8.08 1.35 10.72.9 1.29 1.97 2.74 3.38 2.69 1.36-.06 1.87-.88 3.51-.88s2.1.88 3.53.85c1.46-.03 2.38-1.32 3.27-2.62 1.03-1.5 1.46-2.95 1.48-3.03-.03-.01-2.84-1.09-2.87-4.32zM14.4 4.9c.74-.9 1.24-2.15 1.1-3.4-1.07.05-2.36.72-3.13 1.61-.68.79-1.28 2.06-1.12 3.27 1.2.09 2.42-.6 3.15-1.48z"/></svg>';
  var PLAY_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.6 2.3c-.24.26-.38.66-.38 1.18v17.04c0 .52.14.92.38 1.18l.06.06 9.54-9.54v-.44L3.66 2.24l-.06.06z"/><path d="M16.4 15.42l-3.2-3.2v-.44l3.2-3.2.07.04 3.79 2.16c1.08.61 1.08 1.62 0 2.24l-3.79 2.16-.07.04z"/><path d="M16.47 15.38L13.2 12.1 3.6 21.7c.36.38.95.42 1.61.05l11.26-6.37z"/><path d="M16.47 8.62L5.21 2.25c-.66-.37-1.25-.33-1.61.05l9.6 9.6 3.27-3.28z"/></svg>';

  function badge(href, small, strong, svg) {
    return '<a class="store-badge" href="' + href + '" rel="noopener" style="width:100%;box-sizing:border-box;justify-content:center">' +
           svg + '<span class="store-badge__text"><small>' + small + '</small><strong>' + strong + '</strong></span></a>';
  }

  // 2026-09-17: Android shipped, so the old "finishing up testing, email us for
  // early access" fallback is gone. Both stores are live; we just lead with the
  // one that matches the device so the right tap target comes first.
  function storeButtons() {
    var apple = badge(APP_STORE, "Download on the", "App Store", APPLE_SVG);
    var play = badge(PLAY_STORE, "Get it on", "Google Play", PLAY_SVG);
    var order = /android/i.test(navigator.userAgent) ? [play, apple] : [apple, play];
    return '<div style="display:flex;flex-direction:column;gap:var(--space-2)">' + order.join("") + '</div>';
  }

  var token = new URLSearchParams(window.location.search).get("token");
  var app = document.getElementById("app");

  if (!token) {
    app.innerHTML =
      '<h1 style="font-size:1.6rem">Invite link incomplete</h1>' +
      '<p style="color:var(--ink-muted);max-width:36ch">This invite link is missing its code. Ask whoever invited you to resend it from FlockTrot.</p>';
  } else {
    var appLink = "camptripplanner://invite/" + encodeURIComponent(token);

    // 2026-08-28: the real gap reported by a real tester (two sisters who
    // didn't have the app yet) wasn't the copy — it's that this page never
    // actually offered a way to GO INSTALL the app. "Open in FlockTrot"
    // silently does nothing if the app isn't there yet (custom schemes fail
    // silent in mobile browsers, no error, no prompt), and the old fallback
    // card only offered a code to save for later with no link to actually go
    // get the app. The "get the app" card stays a prominent, first-class path.
    app.innerHTML =
      '<h1 style="font-size:1.75rem;margin-bottom:var(--space-2)">You\'re invited to a trip!</h1>' +
      '<p style="color:var(--ink-muted);max-width:34ch;margin-bottom:var(--space-6)">Already have FlockTrot? Tap below to open the invite directly.</p>' +
      '<a class="btn btn--primary" href="' + appLink + '" style="font-size:1.05rem;padding:15px 34px;margin-bottom:var(--space-7)">Open in FlockTrot</a>' +
      '<div class="panel" style="width:100%;text-align:left">' +
        '<h2 style="font-size:1.05rem;margin-bottom:var(--space-4)">Don\'t have FlockTrot yet?</h2>' +
        storeButtons() +
        '<p style="font-size:.82rem;color:var(--ink-muted);line-height:1.55;margin:var(--space-5) 0 0">After installing, come back to this link, or open FlockTrot and tap <strong>Have an invite? Join a trip</strong> in the top-left of your Trips list and paste in this code:</p>' +
        '<div class="code-row">' +
          '<div class="code-box" id="codeBox">' + token + '</div>' +
          '<button id="copyBtn" class="btn btn--amber btn--sm" type="button">Copy</button>' +
        '</div>' +
      '</div>';

    // NOTE: deliberately no auto-attempt at opening the appLink via
    // window.location.href on page load (removed 2026-08-11). iOS Safari can
    // treat a scripted, non-gesture navigation to a custom URL scheme as
    // untrusted and suppress it — and that suppression was observed to also
    // swallow the *genuine* tap on the "Open in FlockTrot" button below it on
    // the same page load. The button's own href is the only path now.

    document.getElementById("copyBtn").addEventListener("click", function () {
      var btn = this;
      navigator.clipboard.writeText(token).then(function () {
        btn.textContent = "Copied!";
        btn.classList.remove("btn--amber");
        btn.classList.add("btn--primary");
        setTimeout(function () {
          btn.textContent = "Copy";
          btn.classList.remove("btn--primary");
          btn.classList.add("btn--amber");
        }, 2000);
      });
    });
  }
</script>
</body>
</html>
